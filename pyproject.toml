[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "recon-atlas"
version = "0.1.0"
description = "Authorized, rate-limited reconnaissance tools with scope enforcement"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
[project.scripts]
recon-atlas = "recon_atlas.cli:main"
[tool.setuptools.packages.find]
include = ["recon_atlas*"]
